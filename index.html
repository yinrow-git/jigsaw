<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jigsaw Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div id="gallery-section">
      <div id="gallery-header">
        <button id="lucky-btn" class="home-btn">🎲 I'm feeling lucky</button>
      </div>
      <div id="gallery-grid"></div>
    </div>

    <div id="config-overlay" class="hidden">
      <div id="config-panel">
        <h3>Settings</h3>
        <div class="config-group">
          <label>Grid Size</label>
          <div class="config-options" id="size-options">
            <button data-size="1">1️⃣</button>
            <button data-size="2">2️⃣</button>
            <button data-size="3" class="active">3️⃣</button>
            <button data-size="4">4️⃣</button>
            <button data-size="5">5️⃣</button>
            <button data-size="6">6️⃣</button>
            <button data-size="7">7️⃣</button>
            <button data-size="8">8️⃣</button>
            <button data-size="9">9️⃣</button>
          </div>
        </div>
        <button id="config-apply-btn">Apply</button>
      </div>
    </div>

    <div id="delete-overlay" class="hidden">
      <div id="delete-panel">
        <h3>Delete This Puzzle?</h3>
        <p id="delete-message"></p>
        <button id="delete-confirm-btn">Delete</button>
        <button id="delete-cancel-btn">Cancel</button>
      </div>
    </div>

    <div id="game-section" class="hidden">
      <div class="game-layout">
        <div class="board-and-tray">
          <div id="puzzle-container">
            <div id="puzzle-board"></div>
            <div id="win-overlay" class="hidden">
              <div class="win-content">
                <h2>Congratulations!</h2>
                <button id="next-puzzle-btn" aria-label="New puzzle" title="New puzzle">
                  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>
          <div class="tray-and-controls">
            <div id="puzzle-tray"></div>
            <div class="controls">
              <button id="home-nav-btn" aria-label="Home">🏠</button>
              <button id="config-btn">⚙️</button>
              <button id="delete-puzzle-btn" class="hidden" aria-label="Delete puzzle" title="Delete puzzle">🗑️</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p id="app-promo">Try the mobile app <a href="https://apps.apple.com/app/jigsaw-tray/id6799301492" target="_blank" rel="noopener">Jigsaw Tray</a> for more puzzles</p>
  </div>

  <script src="puzzle.js"></script>
</body>
</html>
